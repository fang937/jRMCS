rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::DartLauncherHardware -> dart_launcher_hardware
      - rmcs_core::controller::shooting::DartLauncherController -> dart_launcher_controller
      - rmcs_core::controller::pid::PidController -> dart_trigger_left_velocity_pid
      - rmcs_core::controller::pid::PidController -> dart_trigger_left_angle_pid
      - rmcs_core::controller::pid::PidController -> dart_trigger_right_velocity_pid
      - rmcs_core::controller::pid::PidController -> dart_trigger_right_angle_pid
      - rmcs_core::controller::pid::PidController -> dart_trigger_motor_velocity_pid
      - rmcs_core::controller::pid::PidController -> dart_trigger_motor_angle_pid
      - rmcs_core::controller::pid::PidController -> dart_yaw_velocity_pid
      - rmcs_core::controller::pid::PidController -> dart_yaw_angle_pid
      - rmcs_core::controller::pid::PidController -> dart_distance_velocity_pid
      - rmcs_core::controller::pid::PidController -> dart_distance_angle_pid

dart_launcher_hardware:
  ros__parameters:
    board_serial: "D4-CDEA-E7A7-6B0C-CAFD-ED52-DF91"
    # 编码器零点：原始刻度 0..8191；位置反馈为减速箱输出轴多圈角度（rad）。
    left_motor_zero_point: 0
    right_motor_zero_point: 0
    # 扳机 M2006：CAN1，反馈 CAN ID = 0x200 + trigger_motor_id = 0x205
    # 控制帧自动使用 0x1FF，ID 5 对应第一个 quarter。
    trigger_motor_id: 5
    trigger_motor_zero_point: 0
    yaw_motor_zero_point: 0
    distance_motor_zero_point: 0

    # TF: odom_imu -> base_link -> yaw_link -> muzzle_link; base_link -> imu_link。
    # 假设 C 板 BMI088 固定在底座。IMU 姿态不参与位置环，仅用于观测和 TF。
    # 无磁力计：yaw 为启动后的相对航向，可能漂移；不估计底座平移。
    publish_rate: 100.0  # ROS IMU 和动态 TF 最大发布频率 Hz；无新 IMU 样本不重复发布
    # TODO(安装标定)：xyz 单位 m，rpy 单位 rad；零值表示重合/对齐占位，并非实测。
    imu_xyz: [0.0, 0.0, 0.0]     # base_link 下 IMU 位置
    imu_rpy: [0.0, 0.0, 0.0]     # sensor 坐标转到 base 的 Rz(yaw)*Ry(pitch)*Rx(roll)
    yaw_xyz: [0.0, 0.0, 0.0]     # base_link 下偏航轴位置，绕局部 +Z 转动
    yaw_angle_scale: 1.0         # 电机输出角 -> 实际偏航关节角传动系数，包含方向
    yaw_angle_offset: 0.0        # 偏航关节角偏置 rad，与软件限位启动原点独立
    muzzle_xyz: [0.0, 0.0, 0.0]  # yaw_link 下发射口位置
    muzzle_rpy: [0.0, 0.0, 0.0]  # yaw_link 下发射口姿态，+X 为发射方向

dart_launcher_controller:
  ros__parameters:
    switch_debounce_ticks: 20
    # 原扳机舵机 1 已改为 M2006 电机；以下数组只对应剩下的舵机 2/3/4。
    fire_angles: [90.0, 90.0, 90.0]
    safe_angles: [90.0, 0.0, 0.0]
    fire_return_angles: [90.0, 90.0, 0.0]
    reload1_angles: [180.0, 90.0, 90.0]
    reload2_angles: [180.0, 90.0, 90.0]
    reload3_angles: [180.0, 90.0, 90.0]
    reload1_return_angles: [90.0, 180.0, 0.0]
    reload2_return_angles: [90.0, 180.0, 0.0]
    reload3_return_angles: [90.0, 180.0, 0.0]
    # 左开关上/中/下分别选择预备、扳机接触、发射位置；单位为减速箱输出轴度，相对启动原点。
    trigger_pre_fire_angle_deg: -15.0
    trigger_contact_angle_deg: 5.0
    # 当前发射角为 -50°；三个位置可独立修改。
    trigger_fire_angle_deg: -50.0
    # 软件限位：相对启动原点的减速箱输出轴角度，必须 min <= 0 <= max。
    trigger_motor_position_min_deg: -57.6
    trigger_motor_position_max_deg: 360.0
    # 左开关每档到目标位置的斜坡速度（减速箱输出轴 rad/s），可分别调节。
    trigger_pre_fire_velocity_limit: 1.0
    trigger_contact_velocity_limit: 1.0
    trigger_fire_velocity_limit: 15.0
    left_motor_position_min: -10000.0      # 左扳机负方向行程（按实际机构标定）
    left_motor_position_max: 10000.0      # 左扳机正方向行程
    right_motor_position_min: -10000.0     # 右扳机负方向行程；与左侧旋向相反，独立标定
    right_motor_position_max: 10000.0     # 右扳机正方向行程
    yaw_motor_position_min: -314.0      # 偏航负方向行程，待机械标定
    yaw_motor_position_max: 314.0       # 偏航正方向行程，待机械标定
    distance_motor_position_min: -314.0 # 距离机构负方向行程，待机械标定
    distance_motor_position_max: 314.0  # 距离机构正方向行程，待机械标定
    # 位置目标变化速率上限（rad/s），不是切换到速度控制模式。
    yaw_motor_velocity_limit: 20.0
    distance_motor_velocity_limit: 20.0
    # 左摇杆 Y 轴每 tick 调整两台 M3508 扳机间距目标（rad）；负值可反向。
    trigger_adjust_sensitivity: 0.01
    joystick_deadzone: 0.08
    reload1_interval_ticks: 2000
    reload2_interval_ticks: 2000
    reload3_interval_ticks: 2000

# 速度内环输出限制单位 N*m；位置外环输出限制单位 rad/s。
# PID 增益和输出限幅沿用当前参数，实际负载下另行整定。
dart_trigger_left_velocity_pid:
  ros__parameters:
    measurement: /trigger/left_motor/velocity
    setpoint: /trigger/left_motor/control_velocity
    control: /trigger/left_motor/control_torque
    kp: 0.08
    ki: 0.0
    kd: 0.0
    output_max: 2.0
    output_min: -2.0

dart_trigger_left_angle_pid:
  ros__parameters:
    measurement: /trigger/left_motor/angle
    setpoint: /trigger/left_motor/control_angle
    control: /trigger/left_motor/control_velocity
    kp: 20.0
    ki: 0.0
    kd: 0.0
    output_max: 80.0
    output_min: -80.0

dart_trigger_right_velocity_pid:
  ros__parameters:
    measurement: /trigger/right_motor/velocity
    setpoint: /trigger/right_motor/control_velocity
    control: /trigger/right_motor/control_torque
    kp: 0.08
    ki: 0.0
    kd: 0.0
    output_max: 2.0
    output_min: -2.0

dart_trigger_right_angle_pid:
  ros__parameters:
    measurement: /trigger/right_motor/angle
    setpoint: /trigger/right_motor/control_angle
    control: /trigger/right_motor/control_velocity
    kp: 20.0
    ki: 0.0
    kd: 0.0
    output_max: 80.0
    output_min: -80.0

# 扳机 M2006 位置环：角度环输出速度目标，速度环输出力矩。
# M2006（36:1）输出轴最大力矩约 1.8 N*m，generate_command 会按该值限幅。
# 速度环输出保持 1.8 N*m 以保留最大转动力矩；保留小力矩输出以抵抗外力、锁住扳机位置。
dart_trigger_motor_velocity_pid:
  ros__parameters:
    measurement: /trigger/motor/velocity
    setpoint: /trigger/motor/control_velocity
    control: /trigger/motor/control_torque
    kp: 0.8
    ki: 0.0
    kd: 0.0
    output_max: 1.8
    output_min: -1.8

# 角度环输出限幅 4.0 rad/s；保留小幅速度修正，使位置误差可传递到速度环形成保持力矩。
dart_trigger_motor_angle_pid:
  ros__parameters:
    measurement: /trigger/motor/angle
    setpoint: /trigger/motor/control_angle
    control: /trigger/motor/control_velocity
    kp: 12.0
    ki: 0.0
    kd: 0.0
    output_max: 4.0
    output_min: -4.0

# yaw/distance 也是 M2006，最大输出约 1.8 N*m。
# 速度环 kp 0.02->0.3、力矩上限 0.2->1.2 N*m，提高加速度和跟随能力；
# 如果出现高频抖动，先把 output_max 降到 0.8 或 kp 降到 0.2。
dart_yaw_velocity_pid:
  ros__parameters:
    measurement: /yaw_motor/velocity
    setpoint: /yaw_motor/control_velocity
    control: /yaw_motor/control_torque
    kp: 0.3
    ki: 0.0
    kd: 0.0
    output_max: 1.2
    output_min: -1.2

# 角度环输出限幅 20 rad/s，提高右摇杆目标变化时的跟随速度。
dart_yaw_angle_pid:
  ros__parameters:
    measurement: /yaw_motor/angle
    setpoint: /yaw_motor/control_angle
    control: /yaw_motor/control_velocity
    kp: 20.0
    ki: 0.0
    kd: 0.0
    output_max: 20.0
    output_min: -20.0

dart_distance_velocity_pid:
  ros__parameters:
    measurement: /distance_motor/velocity
    setpoint: /distance_motor/control_velocity
    control: /distance_motor/control_torque
    kp: 0.3
    ki: 0.0
    kd: 0.0
    output_max: 1.2
    output_min: -1.2

dart_distance_angle_pid:
  ros__parameters:
    measurement: /distance_motor/angle
    setpoint: /distance_motor/control_angle
    control: /distance_motor/control_velocity
    kp: 20.0
    ki: 0.0
    kd: 0.0
    output_max: 20.0
    output_min: -20.0
